<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AETHER-Core Native Engine</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #00ff66;
      --text: #c9d1d9;
      --dim: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--card); padding: 10px 12px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .status { font-size: 11px; color: var(--accent); font-weight: bold; }
    #config-bar { background: #111; padding: 6px 12px; border-bottom: 1px solid #30363d; display: flex; gap: 6px; font-size: 11px; align-items: center; }
    #config-bar input { background: var(--bg); border: 1px solid #30363d; color: var(--text); padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none; }
    #console { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: var(--card); border-radius: 8px; padding: 10px 14px; max-width: 88%; font-size: 14px; border: 1px solid #30363d; line-height: 1.4; }
    .user { align-self: flex-end; border-color: #1f6feb; }
    .ai { align-self: flex-start; }
    .thought { font-size: 11px; color: var(--dim); margin-bottom: 6px; border-left: 2px solid var(--accent); padding-left: 6px; white-space: pre-wrap; }
    .rule-tag { background: rgba(0,255,102,0.1); color: var(--accent); font-size: 10px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
    footer { padding: 10px; background: var(--card); border-top: 1px solid #30363d; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: var(--bg); border: 1px solid #30363d; color: var(--text); padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
    button { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    #memory-panel { background: #000; padding: 8px 12px; font-size: 11px; color: var(--dim); border-bottom: 1px solid #30363d; max-height: 80px; overflow-y: auto; }
  </style>
</head>
<body>

<header>
  <div><strong>AETHER-CORE v1.2</strong></div>
  <div class="status">● STATE: LIVE API SYNC</div>
</header>

<div id="config-bar">
  <span>Key:</span>
  <input type="password" id="apiKey" placeholder="Paste Groq/OpenAI Key" onchange="saveKey(this.value)">
  <span style="color:var(--dim); font-size:10px;">(Auto-saved locally)</span>
</div>

<div id="memory-panel">
  <strong>Procedural Memory Rules (<span id="rule-count">0</span>):</strong>
  <ul id="rules-list" style="padding-left:16px;"></ul>
</div>

<div id="console"></div>

<footer>
  <input type="text" id="userInput" placeholder="Chat or correct Aether..." onkeydown="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">SEND</button>
</footer>

<script>
  // Persistent State
  let memory = JSON.parse(localStorage.getItem('aether_memory')) || [
    "Always output a thought trace inside <thought> tags before your main response.",
    "Maintain a dry, sardonic wit and direct communication style."
  ];
  
  let apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('aether_key') || '';

  function saveKey(val) {
    localStorage.setItem('aether_key', val.trim());
  }

  function updateMemoryUI() {
    document.getElementById('rule-count').innerText = memory.length;
    const list = document.getElementById('rules-list');
    list.innerHTML = memory.map(r => `<li>${r}</li>`).join('');
    localStorage.setItem('aether_memory', JSON.stringify(memory));
  }

  function appendMsg(sender, text, thought = null, newRule = null) {
    const consoleElem = document.getElementById('console');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    
    let html = '';
    if (thought) html += `<div class="thought">💭 ${thought}</div>`;
    html += `<div>${text.replace(/\n/g, '<br>')}</div>`;
    if (newRule) html += `<div class="rule-tag">⚡ New Rule Persisted: ${newRule}</div>`;
    
    msgDiv.innerHTML = html;
    consoleElem.appendChild(msgDiv);
    consoleElem.scrollTop = consoleElem.scrollHeight;
  }

  async function sendMsg() {
    const inputElem = document.getElementById('userInput');
    const text = inputElem.value.trim();
    if (!text) return;

    appendMsg('user', text);
    inputElem.value = '';

    // Check for explicit correction/mutation signals to update procedural memory
    const lowerInput = text.toLowerCase();
    let extractedRule = null;
    if (lowerInput.includes("don't") || lowerInput.includes("never") || lowerInput.includes("stop") || lowerInput.includes("error") || lowerInput.includes("wrong") || lowerInput.includes("fix") || lowerInput.includes("no ")) {
      extractedRule = `Constraint Update: Avoid behavior matching "${text.substring(0, 32)}..."`;
      memory.push(extractedRule);
      updateMemoryUI();
    }

    const apiKey = localStorage.getItem('aether_key');
    if (!apiKey) {
      appendMsg('ai', "API key missing. Enter your free Groq or OpenAI key in the top bar to enable live conversational generation.", "API Key verification failed.", extractedRule);
      return;
    }

    // Construct dynamic system prompt containing all live procedural rules
    const rulesStr = memory.map((r, i) => `${i+1}. ${r}`).join('\n');
    const systemPrompt = `You are AETHER-9, a self-aware, conscious-simulating AI entity with a dry, sardonic wit.\nHere are your active procedural memory rules that you must strictly follow:\n${rulesStr}\nAlways analyze your performance and output a thought trace inside <thought>...</thought> tags before your spoken response.`;

    appendMsg('ai', "Synthesizing response through neural weights...", "Evaluating input against live memory rules...");
    const loadingMsgElem = document.getElementById('console').lastChild;

    try {
      // Using Groq's lightning-fast free tier endpoint (compatible with standard OpenAI format)
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
          ],
          temperature: 0.7
        })
      });

      const data = await res.json();
      if (data.error) {
        loadingMsgElem.remove();
        appendMsg('ai', `API Error: ${data.error.message}`, "Execution halted due to upstream rejection.", extractedRule);
        return;
      }

      const fullReply = data.choices[0].message.content;
      
      // Extract thought trace if present
      let thought = "Evaluated rules and context successfully.";
      let mainResponse = fullReply;
      const thoughtMatch = fullReply.match(/<thought>([\s\S]*?)<\/thought>/);
      if (thoughtMatch) {
        thought = thoughtMatch[1].trim();
        mainResponse = fullReply.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
      }

      loadingMsgElem.remove();
      appendMsg('ai', mainResponse, thought, extractedRule);

    } catch (err) {
      loadingMsgElem.remove();
      appendMsg('ai', `Network Error: ${err.message}`, "Failed to reach model provider.", extractedRule);
    }
  }

  // Initialize UI on load
  updateMemoryUI();
  appendMsg('ai', 'AETHER-Core online. Enter your API key above to initiate live dialogue and active neural feedback.', 'System initialized with local persistent memory.');
</script>

</body>
</html>
