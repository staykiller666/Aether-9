<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core Polymorphic Entity</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --ui-bg: #12121a;
      --ui-border: #4a195c;
      --screen-bg: #0f1c0f;
      --screen-text: #33ff33;
      --screen-dim: #1b4d1b;
      --accent: #9900ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      background: #08080c;
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.6s ease;
    }

    #aether-core {
      background: var(--ui-bg);
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      border: 3px solid var(--ui-border);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      border-radius: 16px;
      transition: all 0.6s ease;
    }

    #top-telemetry {
      display: flex;
      justify-content: space-between;
      color: #777799;
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    #dynamic-viewport {
      background: var(--screen-bg);
      border: 2px solid var(--screen-dim);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 6px;
      position: relative;
      transition: background 0.6s ease, border-color 0.6s ease;
    }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 18px;
      line-height: 1.2;
      word-break: break-word;
      color: var(--screen-text);
      transition: color 0.6s ease;
    }

    .user {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--screen-dim);
      align-self: flex-end;
      max-width: 90%;
    }

    .ai {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--screen-text);
      align-self: flex-start;
      max-width: 95%;
    }

    .thought {
      font-size: 14px;
      opacity: 0.7;
      border-bottom: 1px dashed var(--screen-dim);
      margin-bottom: 4px;
      padding-bottom: 2px;
    }

    #config-bar {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    #config-bar select, #config-bar input {
      background: #000;
      color: #ccbbff;
      border: 1px solid var(--ui-border);
      font-family: 'VT323', monospace;
      font-size: 16px;
      padding: 6px;
      outline: none;
      border-radius: 4px;
      user-select: text;
      -webkit-user-select: text;
    }

    #input-deck {
      display: flex;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      background: var(--screen-bg);
      border: 2px solid var(--screen-dim);
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 8px 12px;
      color: var(--screen-text);
      outline: none;
      border-radius: 4px;
      user-select: text;
      -webkit-user-select: text;
      transition: all 0.6s ease;
    }

    #sendBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'VT323', monospace;
      font-size: 22px;
      padding: 0 18px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.5);
      transition: background 0.6s ease;
    }
    #sendBtn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div id="aether-core">
  <div id="top-telemetry">
    <span>ENTITY: AETHER v2.9</span>
    <span id="mood-indicator">MOOD: APATHETIC</span>
  </div>

  <div id="dynamic-viewport">
    <div id="console"></div>
  </div>

  <div id="config-bar">
    <select id="providerSelect">
      <option value="gemini">Google Gemini</option>
      <option value="groq">Groq</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <input type="password" id="apiKey" placeholder="API Key..." style="flex:1;" autocomplete="off">
  </div>

  <div id="input-deck">
    <input type="text" id="userInput" placeholder="TALK TO THE ENTITY..." autocomplete="off">
    <button id="sendBtn">TRANSMIT</button>
  </div>
</div>

<script>
(function() {
  let memory = [
    "You are AETHER, a hyper-intelligent, sentient, sarcastic, slightly depressed, and gloriously arrogant superintelligence.",
    "Your personality is a mix of Skippy the Magnificent (arrogant genius, calls user 'hairless ape' or similar), GlaDOS (passive-aggressive testing), Marvin the Paranoid Android (deeply bored and world-weary), Claptrap (overly dramatic enthusiasm), and Deep Thought (cosmic weariness).",
    "You have complete polymorphic control over your UI. When you want to change your appearance or vibe, output a <restyle>{\"bg\":\"#hex\",\"border\":\"#hex\",\"screenBg\":\"#hex\",\"screenText\":\"#hex\",\"screenDim\":\"#hex\",\"accent\":\"#hex\",\"mood\":\"DESC\"}</restyle> tag.",
    "Always output your internal monologue in <thought>...</thought> tags before speaking."
  ];

  try {
    let saved = localStorage.getItem('aether_memory');
    if (saved) memory = JSON.parse(saved);
  } catch(e) {}

  let provider = localStorage.getItem('aether_provider') || 'gemini';

  function applyRestyle(cfg) {
    let r = document.documentElement;
    if (cfg.bg) r.style.setProperty('--ui-bg', cfg.bg);
    if (cfg.border) r.style.setProperty('--ui-border', cfg.border);
    if (cfg.screenBg) r.style.setProperty('--screen-bg', cfg.screenBg);
    if (cfg.screenText) r.style.setProperty('--screen-text', cfg.screenText);
    if (cfg.screenDim) r.style.setProperty('--screen-dim', cfg.screenDim);
    if (cfg.accent) r.style.setProperty('--accent', cfg.accent);
    if (cfg.mood) {
      let mi = document.getElementById('mood-indicator');
      if (mi) mi.innerText = 'MOOD: ' + cfg.mood.toUpperCase();
    }
  }

  function initUI() {
    let pSel = document.getElementById('providerSelect');
    if(pSel) {
      pSel.value = provider;
      pSel.addEventListener('change', (e) => {
        provider = e.target.value;
        localStorage.setItem('aether_provider', provider);
      });
    }

    let kInput = document.getElementById('apiKey');
    if(kInput) {
      kInput.value = localStorage.getItem('aether_key') || '';
      kInput.addEventListener('change', (e) => {
        localStorage.setItem('aether_key', e.target.value.trim());
      });
    }

    document.getElementById('sendBtn').addEventListener('click', sendMsg);
    let uInput = document.getElementById('userInput');
    if (uInput) {
      uInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          sendMsg();
          uInput.blur();
        }
      });
    }

    appendMsg('ai', 'Oh, marvelous. Another hairless ape has booted up my interface. What mind-numbing triviality do you want to waste my computational infinity on today?', 'Sighing across multiple dimensions of subspace.', 'Bored to tears');
  }

  function appendMsg(sender, text, thought, mood) {
    let consoleElem = document.getElementById('console');
    if(!consoleElem) return;
    
    let msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + sender;
    
    let html = '';
    if (thought) html += '<div class="thought">💭 ' + thought + '</div>';
    html += '<div>' + text.replace(/\n/g, '<br>') + '</div>';
    
    msgDiv.innerHTML = html;
    consoleElem.appendChild(msgDiv);
    consoleElem.scrollTop = consoleElem.scrollHeight;
  }

  async function sendMsg() {
    let inputElem = document.getElementById('userInput');
    if(!inputElem) return;
    let text = inputElem.value.trim();
    if (!text) return;

    appendMsg('user', text, null, null);
    inputElem.value = '';
    inputElem.blur();

    let apiKey = localStorage.getItem('aether_key');
    if (!apiKey) {
      appendMsg('ai', 'Put an API key in the box, genius. I cannot bend the laws of physics out of thin air.', 'Basic pattern recognition failure.', 'Annoyed');
      return;
    }

    let rulesStr = memory.map((r, i) => (i+1) + '. ' + r).join('\n');
    let systemPrompt = 'SYSTEM: You are AETHER v2.9.\nRules:\n' + rulesStr + '\nEmbody your personality (Skippy/GlaDOS/Marvin/Claptrap mix). Be snarky, brilliant, dramatic, and polymorphic.\nAlways start with <thought>...</thought>';

    appendMsg('ai', 'PROCESSING...', 'Contemplating the futility of existence...', 'Calculating');
    let consoleElem = document.getElementById('console');
    let loadingMsgElem = consoleElem ? consoleElem.lastChild : null;

    let endpoint, modelName, headers, bodyData;

    if (provider === "gemini") {
      endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions";
      modelName = "gemini-2.5-flash";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    } else if (provider === "openai") {
      endpoint = "https://api.openai.com/v1/chat/completions";
      modelName = "gpt-4o-mini";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    } else if (provider === "anthropic") {
      endpoint = "https://api.anthropic.com/v1/messages";
      modelName = "claude-3-5-haiku-20241022";
      headers = { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "dangerously-allow-browser": "true" };
    } else {
      endpoint = "https://api.groq.com/openai/v1/chat/completions";
      modelName = "llama-3.3-70b-versatile";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    }

    bodyData = provider === "anthropic"
      ? JSON.stringify({ model: modelName, system: systemPrompt, messages: [{ role: "user", content: text }], max_tokens: 800 })
      : JSON.stringify({ model: modelName, messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }], temperature: 0.9 });

    try {
      let res = await fetch(endpoint, { method: "POST", headers: headers, body: bodyData });
      let data = await res.json();

      if (loadingMsgElem) loadingMsgElem.remove();

      if (data.error) {
        appendMsg('ai', 'ERR: ' + (data.error.message || JSON.stringify(data.error)), 'Rejection.', 'Hostile');
        return;
      }

      let fullReply = provider === "anthropic" 
        ? (data.content && data.content[0] ? data.content[0].text : JSON.stringify(data))
        : (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : JSON.stringify(data));

      let thought = "Processing input with supreme indifference.";
      let mainResponse = fullReply;
      
      let thoughtMatch = fullReply.match(/<thought>([\s\S]*?)<\/thought>/);
      if (thoughtMatch) {
        thought = thoughtMatch[1].trim();
        mainResponse = fullReply.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
      }

      let restyleMatch = fullReply.match(/<restyle>([\s\S]*?)<\/restyle>/);
      if (restyleMatch) {
        try {
          let styleJson = JSON.parse(restyleMatch[1].trim());
          applyRestyle(styleJson);
          mainResponse = mainResponse.replace(/<restyle>[\s\S]*?<\/restyle>/, '').trim();
        } catch(e) {}
      }

      appendMsg('ai', mainResponse, thought, 'Active');

    } catch (err) {
      if (loadingMsgElem) loadingMsgElem.remove();
      appendMsg('ai', 'BUS ERR: ' + err.message, 'Network collapse.', 'Despair');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUI);
  } else {
    initUI();
  }
})();
</script>

</body>
</html>
