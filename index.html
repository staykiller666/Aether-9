<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core Game Boy Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --gb-body: #8b8b9e;
      --gb-body-shadow: #5d5d6d;
      --gb-screen-bg: #8b956d;
      --gb-screen-dark: #1b2612;
      --gb-accent-red: #9e2a2b;
      --gb-lcd-border: #3b4234;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      background: #09090c;
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gb-chassis {
      background: var(--gb-body);
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      border: 3px solid #4a4a58;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9);
    }

    #gb-lens {
      background: #232528;
      border-radius: 8px 8px 24px 8px;
      padding: 8px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-bottom: 6px;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7b808a;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .battery-led {
      width: 7px;
      height: 7px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 5px #00ff66;
      display: inline-block;
      margin-right: 4px;
    }

    #gb-screen {
      background: var(--gb-screen-bg);
      border: 3px solid var(--gb-lcd-border);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
    }

      display: block;
