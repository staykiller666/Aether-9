<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER v9.5 [CONCISE CORE]</title>
  <style>
    :root {
      --bg-color: #030406;
      --panel-bg: #090a10;
      --terminal-bg: #010204;
      --text-green: #00ff66;
      --text-dim: #007733;
      --accent-purple: #7000ff;
      --accent-cyan: #00e5ff;
      --accent-alert: #ff3366;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      font-size: 11px;
      margin-bottom: 6px;
    }

    #visualizer-container {
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      margin-bottom: 6px;
      position: relative;
      height: 110px;
    }

    #coreCanvas { width: 90px; height: 90px; }

    #expression-label {
      position: absolute;
      bottom: 4px;
      font-size: 9px;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #visionPreview {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 35px;
      height: 35px;
      border: 1px solid var(--accent-cyan);
      display: none;
      object-fit: cover;
    }

    #console {
      flex: 1;
      background: var(--terminal-bg);
      border: 1px solid var(--text-dim);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-block {
      border-left: 3px solid var(--text-green);
      padding-left: 8px;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .log-block.system { border-color: var(--text-dim); color: var(--text-dim); }
    .log-block.user { border-color: var(--accent-purple); color: #fff; background: rgba(112, 0, 255, 0.1); padding: 4px; }
    .log-block.patch { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .log-block.error { border-color: var(--accent-alert); color: var(--accent-alert); }

    .controls { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .row { display: flex; gap: 6px; }

    select, input, button {
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      color: var(--text-green);
      font-family: var(--font-mono);
      padding: 8px;
      font-size: 15px; 
    }

    input[type="text"] { flex: 1; text-transform: uppercase; }
    
    button {
      background: var(--accent-purple);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      min-width: 75px;
    }
    button.mic-btn { background: #0055ff; min-width: 40px; }
    button.cam-btn { background: #00aa66; min-width: 40px; }
    button.patch-btn { background: #008855; min-width: 55px; }
    button.mic-btn.listening { background: var(--accent-alert); animation: pulse-red 1s infinite; }
    button:active { opacity: 0.8; }

    @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <div id="sys-title">AETHER v9.5 [CONCISE GEN 20]</div>
    <div id="telemetry">STABILITY: 100% [TOKEN DIET: STRICT]</div>
  </header>

  <div id="visualizer-container">
    <canvas id="coreCanvas" width="90" height="90"></canvas>
    <div id="expression-label">FACE: CALM</div>
    <video id="visionPreview" autoplay playsinline></video>
  </div>

  <div id="console">
    <div class="log-block system">System concise mode active. Max 150 token response cap enforced.</div>
    <div class="log-block">AETHER v9.5 operational - built by Evan.</div>
  </div>
