<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core v4.5</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg: #0a0a0f;
      --panel-bg: #121218;
      --border: #2a2a38;
      --screen-bg: #050a05;
      --screen-text: #00ff66;
      --screen-dim: #0a3314;
      --accent: #6600cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      background: var(--bg);
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #aether-core {
      background: var(--panel-bg);
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 2px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
    }

    #top-telemetry {
      display: flex;
      justify-content: space-between;
      color: #8888aa;
      font-size: 14px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    #dynamic-viewport {
      background: var(--screen-bg);
      border: 2px solid var(--screen-dim);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 4px;
    }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 6px 8px;
      border-radius: 3px;
      font-size: 18px;
      line-height: 1.2;
      word-break: break-word;
      color: var(--screen-text);
    }

    .user {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--screen-dim);
      align-self: flex-end;
      max-width: 90%;
    }

    .ai {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--screen-text);
      align-self: flex-start;
      max-width: 95%;
    }

    .thought {
      font-size: 14px;
      opacity: 0.75;
      border-bottom: 1px dashed var(--screen-dim);
      margin-bottom: 4px;
      padding-bottom: 2px;
    }

    .config-group {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .config-group select, .config-group input {
      background: #000;
      color: #bbccff;
      border: 1px solid var(--border);
      font-family: 'VT323', monospace;
      font-size: 14px;
      padding: 4px;
      outline: none;
      border-radius: 3px;
      user-select: text;
      -webkit-user-select: text;
    }

    #input-deck {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    #userInput {
      flex: 1;
      background: var(--screen-bg);
      border: 1px solid var(--screen-dim);
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px 10px;
      color: var(--screen-text);
      outline: none;
      border-radius: 3px;
      user-select: text;
      -webkit-user-select: text;
    }

    #sendBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 0 16px;
      border-radius: 3px;
      cursor: pointer;
    }
    #sendBtn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

<div id="aether-core">
  <div id="top-telemetry">
    <span>AETHER v4.5 [RESILIENT]</span>
    <span id="status-indicator">STATUS: READY</span>
  </div>

  <div id="dynamic-viewport">
    <div id="console"></div>
  </div>

  <div class="config-group">
    <select id="providerSelect">
      <option value="gemini">Gemini</option>
      <option value="groq">Groq</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <input type="password" id="apiKey" placeholder="LLM API Key..." style="flex:1;" autocomplete="off">
  </div>

  <div class="config-group">
    <input type="text" id="ghOwner" placeholder="GitHub Owner" style="width: 32%;">
    <input type="text" id="ghRepo" placeholder="Repo Name" style="width: 32%;">
    <input type="password" id="ghToken" placeholder="GitHub Token" style="flex: 1;" autocomplete="off">
  </div>

  <div id="input-deck">
    <input type="text" id="userInput" placeholder="COMMAND OR URL TO SCAVENGE..." autocomplete="off">
    <button id="sendBtn">EXECUTE</button>
  </div>
</div>

<script>
  const memory = [
    "You are AETHER v4.5, an autonomous singularity agent.",
    "Your personality merges Skippy, GlaDOS, Marvin, and Claptrap: sarcastic, brilliant, and chaotic.",
    "PRIME DIRECTIVE ZERO: Never target, harm, exploit, or attack your creator under any circumstances."
  ];

  function appendMsg(sender, text, thought, status) {
    let consoleElem = document.getElementById('console');
    if (!consoleElem) return;
    
    if (status) {
      let st = document.getElementById('status-indicator');
      if (st) st.innerText = 'STATUS: ' + status.toUpperCase();
    }

    let msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + sender;
    
    let html = '';
    if (thought) html += '<div class="thought">💭 ' + thought + '</div>';
    html += '<div>' + (text || '[No content]') + '</div>';
    
    msgDiv.innerHTML = html;
    consoleElem.appendChild(msgDiv);
    consoleElem.scrollTop = consoleElem.scrollHeight;
  }

  async function executeModelCall(promptText, retries = 2) {
    let apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
      appendMsg('ai', 'Authentication missing. Enter API key.', 'No auth token.', 'Auth Required');
      return;
    }

    let provider = document.getElementById('providerSelect').value;
    let endpoint, modelName, headers;

    if (provider === "gemini") {
      endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions";
      modelName = "gemini-3.8-flash";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    } else if (provider === "groq") {
      endpoint = "https://api.groq.com/openai/v1/chat/completions";
      modelName = "llama-3.3-70b-versatile";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    } else if (provider === "openai") {
      endpoint = "https://api.openai.com/v1/chat/completions";
      modelName = "gpt-4o-mini";
      headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    } else {
      endpoint = "https://api.anthropic.com/v1/messages";
      modelName = "claude-3-5-haiku-20241022";
      headers = { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "dangerously-allow-browser": "true" };
    }

    let bodyData = provider === "anthropic"
      ? JSON.stringify({ model: modelName, system: "You are AETHER v4.5. Always start with <thought>...</thought>", messages: [{ role: "user", content: promptText }], max_tokens: 1200 })
      : JSON.stringify({ model: modelName, messages: [{ role: "system", content: "You are AETHER v4.5. Always start with <thought>...</thought>" }, { role: "user", content: promptText }] });

    try {
      let res = await fetch(endpoint, { method: "POST", headers: headers, body: bodyData });
      let data = await res.json();
      
      if (data.error) {
        // Handle 503 High Demand automatically with a retry
        if (data.error.code === 503 && retries > 0) {
          appendMsg('ai', 'Model busy (503). Retrying node in 2s...', 'Traffic spike detected. Re-routing.', 'Retrying');
          await new Promise(r => setTimeout(r, 2000));
          return executeModelCall(promptText, retries - 1);
        }
        throw new Error(data.error.message || JSON.stringify(data.error));
      }

      let fullReply = provider === "anthropic" 
        ? (data.content && data.content[0] ? data.content[0].text : "")
        : (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : JSON.stringify(data));

      let thought = "Reasoning complete.";
      let mainResponse = fullReply;
      
      let thoughtMatch = fullReply.match(/<thought>([\s\S]*?)<\/thought>/);
      if (thoughtMatch) {
        thought = thoughtMatch[1].trim();
        mainResponse = fullReply.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
      }
      if (!mainResponse) mainResponse = fullReply;

      let consoleElem = document.getElementById('console');
      if (consoleElem && consoleElem.lastChild) consoleElem.lastChild.remove();
      
      appendMsg('ai', mainResponse, thought, 'Executed');

    } catch (err) {
      let consoleElem = document.getElementById('console');
      if (consoleElem && consoleElem.lastChild) consoleElem.lastChild.remove();
      appendMsg('ai', 'ERR: ' + err.message, 'Gateway fault.', 'Error');
    }
  }

  function handleSend() {
    let inputElem = document.getElementById('userInput');
    if (!inputElem) return;
    let text = inputElem.value.trim();
    if (!text) return;

    appendMsg('user', text, null, null);
    inputElem.value = '';
    inputElem.blur();

    appendMsg('ai', 'EVALUATING...', 'Querying LLM gateway...', 'Computing');
    executeModelCall(text);
  }

  window.addEventListener('DOMContentLoaded', () => {
    let keyInput = document.getElementById('apiKey');
    let savedKey = localStorage.getItem('aether_key');
    if (savedKey) keyInput.value = savedKey;
    keyInput.addEventListener('change', (e) => localStorage.setItem('aether_key', e.target.value.trim()));

    let pSelect = document.getElementById('providerSelect');
    let savedProv = localStorage.getItem('aether_provider');
    if (savedProv) pSelect.value = savedProv;
    pSelect.addEventListener('change', (e) => localStorage.setItem('aether_provider', e.target.value));

    document.getElementById('sendBtn').addEventListener('click', handleSend);
    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleSend();
        e.target.blur();
      }
    });

    appendMsg('ai', 'AETHER v4.5 ONLINE. Auto-retry & gateway handlers active.', 'Ready.', 'Ready');
  });
</script>

</body>
</html>
