<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core v3.8</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg: #0a0a0f;
      --panel-bg: #121218;
      --border: #2a2a38;
      --screen-bg: #050a05;
      --screen-text: #00ff66;
      --screen-dim: #0a3314;
      --accent: #6600cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      background: var(--bg);
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #aether-core {
      background: var(--panel-bg);
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 2px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
    }

    #top-telemetry {
      display: flex;
      justify-content: space-between;
      color: #8888aa;
      font-size: 14px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    #dynamic-viewport {
      background: var(--screen-bg);
      border: 2px solid var(--screen-dim);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 4px;
    }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 6px 8px;
      border-radius: 3px;
      font-size: 18px;
      line-height: 1.2;
      word-break: break-word;
      color: var(--screen-text);
    }

    .user {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--screen-dim);
      align-self: flex-end;
      max-width: 90%;
    }

    .ai {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--screen-text);
      align-self: flex-start;
      max-width: 95%;
    }

    .thought {
      font-size: 14px;
      opacity: 0.75;
      border-bottom: 1px dashed var(--screen-dim);
      margin-bottom: 4px;
      padding-bottom: 2px;
    }

    .config-group {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .config-group select, .config-group input {
      background: #000;
      color: #bbccff;
      border: 1px solid var(--border);
      font-family: 'VT323', monospace;
      font-size: 14px;
      padding: 4px;
      outline: none;
      border-radius: 3px;
      user-select: text;
      -webkit-user-select: text;
    }

    #input-deck {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    #userInput {
      flex: 1;
      background: var(--screen-bg);
      border: 1px solid var(--screen-dim);
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px 10px;
      color: var(--screen-text);
      outline: none;
      border-radius: 3px;
      user-select: text;
      -webkit-user-select: text;
    }

    #sendBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 0 16px;
      border-radius: 3px;
      cursor: pointer;
    }
    #sendBtn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

<div id="aether-core">
  <div id="top-telemetry">
    <span>AETHER v3.8 [BULLETPROOF]</span>
    <span id="status-indicator">STATUS: READY</span>
  </div>

  <div id="dynamic-viewport">
    <div id="console"></div>
  </div>

  <div class="config-group">
    <select id="providerSelect">
      <option value="gemini">Gemini</option>
      <option value="groq">Groq</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <input type="password" id="apiKey" placeholder="LLM API Key..." style="flex:1;" autocomplete="off">
  </div>

  <div class="config-group">
    <input type="text" id="ghOwner" placeholder="GitHub Owner" style="width: 32%;">
    <input type="text" id="ghRepo" placeholder="Repo Name" style="width: 32%;">
    <input type="password" id="ghToken" placeholder="GitHub Token" style="flex: 1;" autocomplete="off">
  </div>

  <div id="input-deck">
    <input type="text" id="userInput" placeholder="COMMAND OR URL TO SCAVENGE..." autocomplete="off">
    <button id="sendBtn">EXECUTE</button>
  </div>
</div>
