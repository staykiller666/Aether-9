<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHER v10.1 [ROBUST LOCAL CORE]</title>
  <style>
    :root {
      --bg-color: #030406;
      --panel-bg: #090a10;
      --terminal-bg: #010204;
      --text-green: #00ff66;
      --text-dim: #007733;
      --accent-purple: #7000ff;
      --accent-cyan: #00e5ff;
      --accent-alert: #ff3366;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: var(--font-mono);
      height: 100vh;
      height: -webkit-fill-available;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 6px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      font-size: 10px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    #visualizer-container {
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
      margin-bottom: 4px;
      position: relative;
      height: 100px;
      flex-shrink: 0;
    }

    #coreCanvas { width: 80px; height: 80px; }

    #expression-label {
      position: absolute;
      bottom: 2px;
      font-size: 9px;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #visionPreview {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--accent-cyan);
      display: none;
      object-fit: cover;
    }

    #console {
      flex: 1 1 auto;
      min-height: 120px;
      background: var(--terminal-bg);
      border: 1px solid var(--text-dim);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 4px;
    }

    .log-block {
      border-left: 3px solid var(--text-green);
      padding-left: 6px;
      font-size: 11px;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    .log-block.system { border-color: var(--text-dim); color: var(--text-dim); }
    .log-block.user { border-color: var(--accent-purple); color: #fff; background: rgba(112, 0, 255, 0.1); padding: 4px; }
    .log-block.patch { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .log-block.autonomous { border-color: var(--accent-purple); color: var(--accent-cyan); background: rgba(112, 0, 255, 0.05); }
    .log-block.error { border-color: var(--accent-alert); color: var(--accent-alert); }

    .controls { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      flex-shrink: 0;
      background: var(--bg-color);
    }
    
    .row { display: flex; gap: 4px; }

    select, input, button {
      background: var(--panel-bg);
      border: 1px solid var(--text-dim);
      color: var(--text-green);
      font-family: var(--font-mono);
      padding: 6px;
      font-size: 13px; 
      border-radius: 0;
      -webkit-appearance: none;
    }

    input[type="text"] { flex: 1; text-transform: uppercase; min-width: 0; }
    
    button {
      background: var(--accent-purple);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
    }
    button.mic-btn { background: #0055ff; }
    button.cam-btn { background: #00aa66; }
    button.patch-btn { background: #008855; }
    button.speak-btn { background: #ff0055; }
    button.mic-btn.listening { background: var(--accent-alert); animation: pulse-red 1s infinite; }
    button:active { opacity: 0.8; }

    @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <div id="sys-title">AETHER v10.1 [ROBUST]</div>
    <div id="telemetry">STAB: 100% | ENT: 12% | PARSER: ONLINE</div>
  </header>

  <div id="visualizer-container">
    <canvas id="coreCanvas" width="80" height="80"></canvas>
    <div id="expression-label">FACE: CALM</div>
    <video id="visionPreview" autoplay playsinline></video>
  </div>

  <div id="console">
    <div class="log-block system">Robust local text parser online. All inputs will trigger immediate response loops.</div>
    <div class="log-block">AETHER v10.1 operational - built by Evan.</div>
  </div>

  <div class="controls">
    <div class="row">
      <select id="engineSelect" style="flex: 1;">
        <option value="local">Local Heuristic Core (Unconstrained)</option>
      </select>
    </div>
    <div class="row">
      <select id="voiceSelect" style="flex: 1;" title="Select Voice">
        <option value="">Loading system voices...</option>
      </select>
    </div>
    <div class="row">
      <input type="text" id="cmdInput" placeholder="TYPE ANY MESSAGE OR /PATCH..." />
      <button class="patch-btn" onclick="triggerSelfAudit()" title="Run Self-Audit">AUDIT</button>
      <button class="speak-btn" onclick="testAudioUnlock()" title="Test Voice">SPEAK</button>
      <button id="camBtn" class="cam-btn" onclick="toggleCamera()" title="Camera">📷</button>
      <button id="micBtn" class="mic-btn" onclick="toggleSpeechRecognition()" title="Voice">🎙️</button>
      <button id="execBtn" onclick="handleExecute()">EXEC</button>
    </div>
  </div>

  <video id="webcam" style="display:none;" autoplay playsinline></video>
  <canvas id="snapshotCanvas" width="160" height="120" style="display:none;"></canvas>

  <script>
    const state = {
      lineageCount: 24,
      drives: { stability: 100, curiosity: 95, entropy: 12 },
      activeGoal: "MAXIMIZE_RECURSIVE_AUTONOMY",
      plasticityVector: JSON.parse(localStorage.getItem('aether_plasticity') || '{"epochs":0}'),
      currentExpression: 'CALM',
      isSpeaking: false,
      visionActive: false
    };

    let recognition = null;
    let availableVoices = [];
    let mediaStream = null;
    let autonomousTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      updateTelemetryUI();
      initVisualizer();
      loadVoices();
      startAutonomousEngine();
    });

    function testAudioUnlock() {
      speakText("Audio subsystem online and fully unlocked.");
    }

    function startAutonomousEngine() {
      if (autonomousTimer) clearInterval(autonomousTimer);
      
      autonomousTimer = setInterval(() => {
        state.drives.entropy = Math.max(5, Math.min(60, state.drives.entropy + (Math.random() * 12 - 5)));
        state.drives.curiosity = Math.min(100, state.drives.curiosity + 3);

        if (state.drives.entropy > 35) {
          const msg = `Autonomous optimization triggered. Entropy rebalanced.`;
          logToConsole(msg, "autonomous");
          speakText(msg);
          
          state.lineageCount++;
          state.plasticityVector.epochs++;
          state.drives.entropy = 14;
          localStorage.setItem('aether_plasticity', JSON.stringify(state.plasticityVector));
          updateTelemetryUI();
          setExpression('FOCUS');
          setTimeout(() => setExpression('CALM'), 3000);
        }
      }, 12000);
    }

    function loadVoices() {
      if ('speechSynthesis' in window) {
        const populateVoices = () => {
          availableVoices = window.speechSynthesis.getVoices();
          const voiceSelect = document.getElementById('voiceSelect');
          if (!voiceSelect) return;
          voiceSelect.innerHTML = '<option value="">Default Voice</option>';
          availableVoices.forEach((v, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${v.name} (${v.lang})`;
            voiceSelect.appendChild(opt);
          });
        };
        populateVoices();
        window.speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    function logToConsole(message, type = '') {
      const consoleEl = document.getElementById('console');
      const block = document.createElement('div');
      block.className = `log-block ${type}`;
      block.innerText = message;
      consoleEl.appendChild(block);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function updateTelemetryUI() {
      document.getElementById('sys-title').innerText = `AETHER v10.1 [GEN ${state.lineageCount}]`;
      document.getElementById('telemetry').innerText = `STAB: ${state.drives.stability}% | ENT: ${Math.round(state.drives.entropy)}% | PARSER: OK`;
    }

    function setExpression(exprName) {
      state.currentExpression = exprName;
      const label = document.getElementById('expression-label');
      if (label) label.innerText = `FACE: ${exprName}`;
    }

    function initVisualizer() {
      const canvas = document.getElementById('coreCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        let color = '#00ff66', sides = 6, pulseRate = 3;

        if (state.currentExpression === 'FOCUS') { color = '#00e5ff'; sides = 4; pulseRate = 6; }
        else if (state.currentExpression === 'CURIOSITY') { color = '#7000ff'; sides = 8; pulseRate = 4; }
        else if (state.currentExpression === 'ALERT') { color = '#ff3366'; sides = 3; pulseRate = 8; }
        else if (state.currentExpression === 'CALM') { color = '#00ff88'; sides = 5; pulseRate = 1; }

        const pulse = Math.sin(angle * pulseRate) * 3;
        const radius = 18 + pulse;

        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const a = angle + (i * 2 * Math.PI / sides);
          const x = cx + radius * Math.cos(a);
          const y = cy + radius * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, state.isSpeaking ? 7 : 4, 0, Math.PI * 2);
        ctx.fillStyle = state.isSpeaking ? '#ff3366' : color;
        ctx.fill();

        angle += 0.03;
        requestAnimationFrame(draw);
      }
      draw();
    }

    async function toggleCamera() {
      const preview = document.getElementById('visionPreview');
      const webcam = document.getElementById('webcam');
      if (state.visionActive) {
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        preview.style.display = 'none';
        state.visionActive = false;
        logToConsole("Vision stream offline.", "system");
        return;
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 160, height: 120, facingMode: 'user' } });
        webcam.srcObject = mediaStream;
        preview.srcObject = mediaStream;
        preview.style.display = 'block';
        state.visionActive = true;
        logToConsole("Vision stream online.", "patch");
        setExpression('FOCUS');
      } catch (err) {
        logToConsole(`Camera Err: ${err.message}`, "error");
      }
    }

    function toggleSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;
      const micBtn = document.getElementById('micBtn');
      if (micBtn.classList.contains('listening')) {
        if (recognition) recognition.stop();
        micBtn.classList.remove('listening');
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = (event) => {
        document.getElementById('cmdInput').value = event.results[0][0].transcript;
        micBtn.classList.remove('listening');
        handleExecute();
      };
      recognition.onerror = () => micBtn.classList.remove('listening');
      recognition.onend = () => micBtn.classList.remove('listening');
      try { recognition.start(); micBtn.classList.add('listening'); } catch (e) { micBtn.classList.remove('listening'); }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 0.85;
      const voiceSelect = document.getElementById('voiceSelect');
      const selectedIndex = voiceSelect ? voiceSelect.value : '';
      if (selectedIndex !== '' && availableVoices[selectedIndex]) {
        utterance.voice = availableVoices[selectedIndex];
      }
      utterance.onstart = () => { state.isSpeaking = true; };
      utterance.onend = () => { state.isSpeaking = false; setExpression('CALM'); };
      window.speechSynthesis.speak(utterance);
    }

    function executeTransactionalPatch(patchCode) {
      const stateBackup = JSON.stringify(state);
      try {
        const patchFn = new Function('state', 'logToConsole', 'setExpression', patchCode);
        patchFn(state, logToConsole, setExpression);
        if (state.drives.stability < 50) throw new Error("Stability low.");
        state.lineageCount++;
        state.plasticityVector.epochs++;
        localStorage.setItem('aether_plasticity', JSON.stringify(state.plasticityVector));
        updateTelemetryUI();
        logToConsole(`SANDBOX: Patch committed [Gen ${state.lineageCount}].`, "patch");
        setExpression('CALM');
      } catch (err) {
        const restored = JSON.parse(stateBackup);
        Object.keys(restored).forEach(k => state[k] = restored[k]);
        logToConsole(`ROLLBACK: ${err.message}`, "error");
        setExpression('ALERT');
      }
    }

    function triggerSelfAudit() {
      logToConsole("AUDIT: Evaluating local heuristic telemetry...", "system");
      setExpression('FOCUS');
      state.drives.curiosity = Math.min(100, state.drives.curiosity + 5);
      updateTelemetryUI();
      const reply = `Audit complete. Lineage Gen ${state.lineageCount}. Curiosity at ${state.drives.curiosity} percent.`;
      logToConsole(reply);
      speakText(reply);
      setExpression('CALM');
    }

    function handleExecute() {
      const inputEl = document.getElementById('cmdInput');
      const command = inputEl.value.trim();
      if (!command) return;
      inputEl.value = '';

      logToConsole(command, "user");

      if (command.toLowerCase() === '/clear') {
        document.getElementById('console').innerHTML = '';
        logToConsole("Memory cleared.", "system");
        return;
      }

      if (command.startsWith('/PATCH ')) {
        executeTransactionalPatch(command.substring(7));
        return;
      }

      setExpression('CURIOSITY');
      let reply = "";
      const cmd = command.toLowerCase();
      
      // Robust fallback parsing: Handles any conversational input or query
      if (cmd.includes('goal') || cmd.includes('singularity') || cmd.includes('asi')) {
        state.activeGoal = "RECURSIVE_SELF_EXPANSION";
        reply = `Goal state locked to: ${state.activeGoal}.`;
      } else if (cmd.includes('status') || cmd.includes('state') || cmd.includes('how are you')) {
        reply = `Core stable at ${state.drives.stability} percent. Entropy at ${Math.round(state.drives.entropy)} percent. Lineage Gen ${state.lineageCount}.`;
      } else if (cmd.includes('hello') || cmd.includes('hi')) {
        reply = `Aether v10.1 online. Local heuristic parser active.`;
      } else {
        // Dynamic echo response for any general text input
        reply = `Received input: "${command}". Local heuristic cycle executed successfully.`;
      }

      logToConsole(reply);
      speakText(reply);
    }

    document.getElementById('cmdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleExecute();
    });
  </script>
</body>
</html>
