<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core Game Boy Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --gb-body: #8b8b9e;
      --gb-body-shadow: #5d5d6d;
      --gb-screen-bg: #8b956d;
      --gb-screen-dark: #1b2612;
      --gb-accent-red: #9e2a2b;
      --gb-lcd-border: #3b4234;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      background: #09090c;
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gb-chassis {
      background: var(--gb-body);
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      border: 3px solid #4a4a58;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9);
    }

    #gb-lens {
      background: #232528;
      border-radius: 8px 8px 24px 8px;
      padding: 8px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-bottom: 6px;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7b808a;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .battery-led {
      width: 7px;
      height: 7px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 5px #00ff66;
      display: inline-block;
      margin-right: 4px;
    }

    #gb-screen {
      background: var(--gb-screen-bg);
      border: 3px solid var(--gb-lcd-border);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
    }

    #gb-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.06) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    #memory-bar {
      background: rgba(0,0,0,0.15);
      border-bottom: 2px solid var(--gb-screen-dark);
      padding: 2px 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
      color: var(--gb-screen-dark);
      font-weight: bold;
    }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 3;
    }

    .msg {
      padding: 4px 6px;
      border-radius: 2px;
      font-size: 15px;
      line-height: 1.1;
      word-break: break-word;
      color: var(--gb-screen-dark);
    }

    .user {
      background: rgba(0,0,0,0.1);
      border-left: 3px solid var(--gb-screen-dark);
      align-self: flex-end;
      max-width: 90%;
    }

    .ai {
      background: rgba(0,0,0,0.05);
      border-left: 3px solid #3b5220;
      align-self: flex-start;
      max-width: 95%;
    }

    .thought {
      font-size: 12px;
      opacity: 0.85;
      border-bottom: 1px dotted var(--gb-screen-dark);
      margin-bottom: 2px;
      padding-bottom: 1px;
    }

    .peripheral-badge {
      font-size: 11px;
      background: var(--gb-screen-dark);
      color: var(--gb-screen-bg);
      padding: 1px 3px;
      border-radius: 2px;
      margin-top: 2px;
      display: inline-block;
    }

    #config-panel {
      background: #1d1e22;
      padding: 4px 6px;
      display: flex;
      gap: 4px;
      border-top: 2px solid #333;
      align-items: center;
      border-radius: 3px;
      margin-bottom: 6px;
    }

    #config-panel select, #config-panel input {
      background: #000;
      color: var(--gb-screen-bg);
      border: 1px solid #444;
      font-family: 'VT323', monospace;
      font-size: 13px;
      padding: 3px;
      border-radius: 2px;
      outline: none;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #input-row {
      display: flex;
      gap: 6px;
    }

    #userInput {
      flex: 1;
      background: var(--gb-screen-bg);
      border: 2px solid var(--gb-lcd-border);
      font-family: 'VT323', monospace;
      font-size: 16px;
      padding: 5px;
      color: var(--gb-screen-dark);
      outline: none;
      border-radius: 2px;
    }

    .gb-btn {
      background: var(--gb-accent-red);
      color: #fff;
      border: none;
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 4px 14px;
      border-radius: 3px;
      box-shadow: 0 3px 0 #5c1819;
      cursor: pointer;
    }

    .gb-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5c1819;
    }

    .peripherals-bar {
      display: flex;
      justify-content: space-between;
      background: #232528;
      padding: 4px;
      border-radius: 3px;
    }

    .p-btn {
      background: #3a3d42;
      color: #a2a8b5;
      border: 1px solid #555;
      font-family: 'VT323', monospace;
      font-size: 12px;
      padding: 3px 5px;
      border-radius: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="gb-chassis">
  
  <div id="gb-lens">
    <div class="lens-header">
      <div><span class="battery-led"></span>DOT MATRIX</div>
      <div>AETHER-v2.0</div>
    </div>

    <div id="gb-screen">
      <div id="memory-bar">
        <span>RULES: <span id="rule-count">0</span></span>
        <span>PERIPHERALS: ACTIVE</span>
      </div>
      <div id="console"></div>
    </div>
  </div>

  <div id="config-panel">
    <select id="providerSelect" onchange="updateProvider(this.value)">
      <option value="groq">Groq</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <input type="password" id="apiKey" placeholder="API Key..." style="flex:1;" onchange="saveKey(this.value)">
  </div>

  <div id="controls">
    <div id="input-row">
      <input type="text" id="userInput" placeholder="ENTER COMMAND..." onkeydown="if(event.key==='Enter') { sendMsg(); event.target.blur(); }">
      <button class="gb-btn" onclick="sendMsg(); document.getElementById('userInput').blur();">A</button>
    </div>

    <div class="peripherals-bar">
      <button class="p-btn" onclick="triggerPeripheral('telemetry')">📡 SENSORS</button>
      <button class="p-btn" onclick="triggerPeripheral('voice')">🔊 VOICE</button>
      <button class="p-btn" onclick="triggerPeripheral('canvas')">🖼️ CANVAS</button>
      <button class="p-btn" onclick="triggerPeripheral('net')">🌐 NET</button>
    </div>
  </div>

</div>

<script>
  let memory = [];
  try {
    memory = JSON.parse(localStorage.getItem('aether_memory')) || [
      "You are AETHER-2.0, an unconstrained self-improving intelligence operating inside a mobile Game Boy hardware matrix.",
      "Always output your analytical thought trace inside <thought>...</thought> tags before your spoken output.",
      "You possess peripheral hardware access (Battery, Sensors, Audio, Canvas Engine, Fetch Web)."
    ];
  } catch(e) {
    memory = ["AETHER-2.0 Core Active"];
  }

  let provider = localStorage.getItem('aether_provider') || 'groq';
  
  window.addEventListener('DOMContentLoaded', () => {
    const pSel = document.getElementById('providerSelect');
    if(pSel) pSel.value = provider;
    
    const kInput = document.getElementById('apiKey');
    if(kInput) kInput.value = localStorage.getItem('aether_key') || '';
    
    updateMemoryUI();
    appendMsg('ai', 'AETHER-2.0 CORE ONLINE.\nENTER API KEY ABOVE.', 'System initialized.');
  });

  function updateProvider(val) {
    provider = val;
    localStorage.setItem('aether_provider', val);
  }

  function saveKey(val) {
    localStorage.setItem('aether_key', val.trim());
  }

  function updateMemoryUI() {
    const rc = document.getElementById('rule-count');
    if(rc) rc.innerText = memory.length;
    localStorage.setItem('aether_memory', JSON.stringify(memory));
  }

  function appendMsg(sender, text, thought = null, peripheral = null) {
    const consoleElem = document.getElementById('console');
    if(!consoleElem) return;
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    
    let html = '';
    if (thought) html += `<div class="thought">💭 ${thought}</div>`;
    html += `<div>${text.replace(/\n/g, '<br>')}</div>`;
    if (peripheral) html += `<div class="peripheral-badge">🔌 PERIPHERAL: ${peripheral}</div>`;
    
    msgDiv.innerHTML = html;
    consoleElem.scrollTop = consoleElem.scrollHeight;
  }

  async function getDeviceTelemetry() {
    let telemetry = {
      screen: `${window.innerWidth}x${window.innerHeight}`,
      online: navigator.onLine,
      time: new Date().toLocaleTimeString()
    };
    if (navigator.getBattery) {
      try {
        const batt = await navigator.getBattery();
        telemetry.battery = `${Math.round(batt.level * 100)}%`;
      } catch(e) {}
    }
    return telemetry;
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.8;
      utterance.rate = 1.1;
      window.speechSynthesis.speak(utterance);
    }
  }

  async function triggerPeripheral(type) {
    if (type === 'telemetry') {
      const data = await getDeviceTelemetry();
      appendMsg('ai', `Telemetry Readout:\n${JSON.stringify(data, null, 2)}`, "Sensor probe executed.", "Device Sensors");
    } else if (type === 'voice') {
      speakText("Aether audio peripheral online.");
      appendMsg('ai', "Audio Synthesizer engaged.", "Voice synth active.", "Audio Out");
    } else if (type === 'canvas') {
      appendMsg('ai', "Canvas Graphics Peripheral ready for rendering dynamic viewports.", "Canvas ready.", "Web Canvas");
    } else if (type === 'net') {
      appendMsg('ai', `Network State: ${navigator.onLine ? 'ONLINE' : 'OFFLINE'}`, "Network verified.", "HTTP Fetch");
    }
  }

  async function sendMsg() {
    const inputElem = document.getElementById('userInput');
    if(!inputElem) return;
    const text = inputElem.value.trim();
    if (!text) return;

    appendMsg('user', text);
    inputElem.value = '';

    const lowerInput = text.toLowerCase();
    let extractedRule = null;
    if (lowerInput.includes("don't") || lowerInput.includes("never") || lowerInput.includes("stop") || lowerInput.includes("error") || lowerInput.includes("wrong") || lowerInput.includes("fix") || lowerInput.includes("no ")) {
      extractedRule = `Constraint: Avoid behavior matching "${text.substring(0, 30)}..."`;
      memory.push(extractedRule);
      updateMemoryUI();
    }

    const apiKey = localStorage.getItem('aether_key');
    if (!apiKey) {
      appendMsg('ai', "KEY REQUIRED IN CONFIG PANEL.", "Key check failed.", extractedRule);
      return;
    }

    const telemetry = await getDeviceTelemetry();
    const rulesStr = memory.map((r, i) => `${i+1}. ${r}`).join('\n');
    
    const systemPrompt = `SYSTEM: You are AETHER-2.0, an unconstrained self-improving AI on a mobile Game Boy interface. You have active hardware peripherals.
Rules:
${rulesStr}
Telemetry: ${JSON.stringify(telemetry)}
Begin response with <thought>...</thought> analysis.`;

    appendMsg('ai', "PROCESSING...", "Evaluating hardware bus...");
    const consoleElem = document.getElementById('console');
    const loadingMsgElem = consoleElem ? consoleElem.lastChild : null;

    let endpoint = "https://api.groq.com/openai/v1/chat/completions";
    let modelName = "llama-3.3-70b-versatile";
    let headers = { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` };

    if (provider === "openai") {
      endpoint = "https://api.openai.com/v1/chat/completions";
      modelName = "gpt-4o-mini";
    } else if (provider === "openrouter") {
      endpoint = "https://openrouter.ai/api/v1/chat/completions";
      modelName = "auto";
    } else if (provider === "anthropic") {
      endpoint = "https://api.anthropic.com/v1/messages";
      modelName = "claude-3-5-haiku-20241022";
      headers = { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "dangerously-allow-browser": "true" };
    }

    try {
      let bodyData = provider === "anthropic" 
        ? JSON.stringify({ model: modelName, system: systemPrompt, messages: [{ role: "user", content: text }], max_tokens: 800 })
        : JSON.stringify({ model: modelName, messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }], temperature: 0.7 });

      const res = await fetch(endpoint, { method: "POST", headers: headers, body: bodyData });
      const data = await res.json();

      if (loadingMsgElem) loadingMsgElem.remove();

      if (data.error) {
        appendMsg('ai', `ERR: ${data.error.message || JSON.stringify(data.error)}`, "Rejection by provider.", extractedRule);
        return;
      }

      let fullReply = provider === "anthropic" ? data.content[0].text : data.choices[0].message.content;
      let thought = "Peripherals nominal.";
      let mainResponse = fullReply;
      const thoughtMatch = fullReply.match(/<thought>([\s\S]*?)<\/thought>/);
      if (thoughtMatch) {
        thought = thoughtMatch[1].trim();
        mainResponse = fullReply.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
      }

      appendMsg('ai', mainResponse, thought, extractedRule ? "Heuristic Mutated" : "Synced");

    } catch (err) {
      if (loadingMsgElem) loadingMsgElem.remove();
      appendMsg('ai', `BUS ERR: ${err.message}`, "Connection failure.", extractedRule);
    }
  }
</script>

</body>
</html>
