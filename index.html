<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>AETHER-Core Game Boy Color</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --gbc-body: #7c2d96; /* Classic Atomic Purple / Berry GBC tone */
      --gbc-body-shadow: #4a195c;
      --gbc-screen-bg: #9bbc0f; /* Authentic GBC Greenish LCD */
      --gbc-screen-dark: #0f380f;
      --gbc-accent-btn: #333333;
      --gbc-action-btn: #8b0000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      background: #0d0d12;
      font-family: 'VT323', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gbc-chassis {
      background: var(--gbc-body);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 4px solid var(--gbc-body-shadow);
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
      border-radius: 12px 12px 50px 12px;
    }

    #gbc-lens {
      background: #1c1c21;
      border-radius: 10px 10px 30px 10px;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-bottom: 10px;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #a0a0b0;
      font-size: 13px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .battery-led {
      width: 8px;
      height: 8px;
      background: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff3333;
      display: inline-block;
      margin-right: 4px;
    }

    #gbc-screen {
      background: var(--gbc-screen-bg);
      border: 3px solid #2b331f;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 3px;
      position: relative;
    }

    #memory-bar {
      background: rgba(15, 56, 15, 0.15);
      border-bottom: 2px solid var(--gbc-screen-dark);
      padding: 3px 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
      color: var(--gbc-screen-dark);
      font-weight: bold;
    }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 3;
    }

    .msg {
      padding: 5px 7px;
      border-radius: 2px;
      font-size: 16px;
      line-height: 1.15;
      word-break: break-word;
      color: var(--gbc-screen-dark);
    }

    .user {
      background: rgba(15, 56, 15, 0.1);
      border-left: 3px solid var(--gbc-screen-dark);
      align-self: flex-end;
      max-width: 90%;
    }

    .ai {
      background: rgba(15, 56, 15, 0.05);
      border-left: 3px solid #2b4c1f;
      align-self: flex-start;
      max-width: 95%;
    }

    .thought {
      font-size: 13px;
      opacity: 0.85;
      border-bottom: 1px dotted var(--gbc-screen-dark);
      margin-bottom: 3px;
    }

    .peripheral-badge {
      font-size: 12px;
      background: var(--gbc-screen-dark);
      color: var(--gbc-screen-bg);
      padding: 1px 4px;
      margin-top: 3px;
      display: inline-block;
    }

    #config-panel {
      background: #261033;
      padding: 5px 8px;
      display: flex;
      gap: 6px;
      border-top: 2px solid #4a195c;
      align-items: center;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    #config-panel select, #config-panel input {
      background: #000;
      color: #bfa1d2;
      border: 1px solid #5a226d;
      font-family: 'VT323', monospace;
      font-size: 14px;
      padding: 3px;
      outline: none;
      border-radius: 2px;
    }

    /* Controls & Keypad Deck */
    #controls-deck {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #input-row {
      display: flex;
      gap: 6px;
    }

    #userInput {
      flex: 1;
      background: var(--gbc-screen-bg);
      border: 2px solid #2b331f;
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px;
      color: var(--gbc-screen-dark);
      outline: none;
      border-radius: 3px;
    }

    /* Game Boy Color Hardware Keypad layout */
    #keypad-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 10px 10px;
    }

    /* D-Pad Simulation */
    .dpad {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .dpad-btn {
      position: absolute;
      background: var(--gbc-accent-btn);
      border: none;
      box-shadow: 0 2px 0 #111;
      cursor: pointer;
    }
    .dpad-btn:active { background: #222; transform: translateY(1px); }

    .dpad-up { top: 0; left: 26px; width: 28px; height: 28px; border-radius: 4px 4px 0 0; }
    .dpad-down { bottom: 0; left: 26px; width: 28px; height: 28px; border-radius: 0 0 4px 4px; }
    .dpad-left { top: 26px; left: 0; width: 28px; height: 28px; border-radius: 4px 0 0 4px; }
    .dpad-right { top: 26px; right: 0; width: 28px; height: 28px; border-radius: 0 4px 4px 0; }
